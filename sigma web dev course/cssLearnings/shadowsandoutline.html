<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shadows and outline in css</title>
    <style>
        .box{
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px  15px 5px rgb(78, 76, 76);
        }
        .textelement{
            text-shadow:4px 6px 12px #ff008b; ;
        }
    </style>
</head>
<body>
    <div class="box">i am a box</div>
    <p class="textelement">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Ipsam voluptas aspernatur laudantium, repellendus dolores saepe sunt facilis nisi, sed eveniet ad! Exercitationem, dignissimos.</p>
</body>
</html>
