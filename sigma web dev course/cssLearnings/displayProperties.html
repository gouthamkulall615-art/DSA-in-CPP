<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>display properties</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            border: 2px solid black;
            display: inline-block;
            padding: 45px;
            margin: 35px;
        }
    </style>
</head>
<body>
    <div class="box">i am a box</div>
    <div class="box">i am a good box</div>
    <span>i am good</span>
    <span>boy</span>
</body>
</html>
