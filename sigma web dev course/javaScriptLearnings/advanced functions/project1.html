<!DOCTYPE html>
<html>

<head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="project1.css">
</head>

<body>
    <p class="title">Rock Paper Scissors</p>
    <button onclick="
      playGame('rock');
    " class="move-button">
        <img src="images/Fist-Emoji-PNG-1.jpg" class="move-icon">
    </button>

    <button onclick="
      playGame('paper');
    " class="move-button">
        <img src="images/paper.jpg" class="move-icon">
    </button>

    <button onclick="
      playGame('scissors');
    " class="move-button">
        <img src="images/scissors.jpg" class="move-icon">
    </button>

    <p class="js-result result"></p>
    <p class="js-moves"></p>
    <p class="js-score score"></p>

    <button onclick="
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      localStorage.removeItem('score');
      updateScoreElement();
    " class="reset-score-button">Reset Score</button>

    <button class="auto-play-btn" onclick="
    autoplay();
    ">Auto Play</button>

    <script src="project1.js"></script>
</body>

</html>
