<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css sizizng unit</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        html{
            font-size: 12px;
        }
        .box{
            box-sizing: border-box;
            border: 2px solid black;
            /* width: 1920px; */
            width: 80vw;
            height: 10vh;
            margin: auto;
            background-color: aquamarine;
        }
        .container{
             box-sizing: border-box;
            border: 2px solid black;
            /* width: 1920px; */
            width: 80vw;
            height: 80vh;
            margin: 23px auto;
           font-size: 18px;

            background-color: aquamarine;
        }
        .container p{
            font-size: 2em;
        }
    </style>
</head>
<body>
    <div class="box"> this is a box</div>
    <div class="container">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Accusantium culpa, fugiat consectetur, commodi a nesciunt ipsum nam atque ipsam inventore quos, perferendis molestias.</p>
       
    </div>
</body>
</html>
