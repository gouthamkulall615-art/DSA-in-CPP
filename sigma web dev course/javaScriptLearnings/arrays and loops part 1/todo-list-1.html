<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to do list practice one</title>
    <style>
        p {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
        }

        .js-name-input {
            padding: 12px;
        }

        .js-due {
            padding: 12px;
        }

        #add {
            padding: 12px;
            border: none;
            color: white;
            background-color: green;
        }

        .todo-grid,
        .input-grid {
            display: grid;
            grid-template-columns: 200px 150px 100px;
            column-gap: 13px;
            row-gap: 15px;
            align-items: center;

        }

        .input-grid {
            margin-bottom: 15px;
            
        }
       .delete{
        background-color: rgb(117, 8, 8);
        padding: 8px;
        border: none;
        color: white;
       }
    </style>
</head>

<body>
    <p>Todo list</p>
    <div class="input-grid">
        <input placeholder="todo name" class="js-name-input">
        <input type="date" class="js-due">
        <button onclick="addTodo()
    " id="add">ADD</button>
    </div>

    <div class="js-todo-list todo-grid"></div>
    <script src="script.js"></script>

</body>

</html>
