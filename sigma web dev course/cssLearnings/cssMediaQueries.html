<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css media query</title>
    <style>
        body{
            background-color: red;
        }
        @media only screen and (max-width:500px) {
            body{
                background-color: aqua;
            }
            .boxes{
                flex-direction: column;
            }
        }
        .boxes{
            display: flex;
        }
        .box{
            height: 100px;
            width: 100px;
            border: 3px solid black;
            padding: 3px;
        }
    </style>
</head>
<body>
    <!-- <div>i am goutham from karnataka</div>
      -->
    <div class="boxes">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
