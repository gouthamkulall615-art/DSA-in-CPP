<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css position property</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .box {
            height: 433px;
            width: 80vw;
            padding: 4px;
            margin: 4px;
            border: 2px solid black;
        }

        .box1 {
            background-color: orange;
             position: sticky;
            top: 0px;
            height: 111px;
            width: 100%;
            margin: 0;
            padding: 0;

            /* position: absolute;
            top: 0px;
            left: 3px; */
           

        }

        .box2 {
            background-color: aqua;
            /* position: relative;
            top: 34px;
            left: 56px; */
        }

        .box3 {
            background-color: yellow;
            /* position: fixed;
            bottom: 0px;
            left: 8vw;
            height: 111px; */
        }

        .box4 {
            background-color: maroon;
        }

        
        .parent{
        padding: 43px;
        margin: 34px;
        border: 2px solid purple;
        /* position: absolute; */
        }
    </style>
</head>

<body>
    <div class="parent">
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
    </div>

</body>

</html>
