<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css variables</title>
    <style>
        :root{
            --color:rgb(229, 134, 164);
            --seccolor:rgb(231, 175, 226);

        }
        *{
            margin: 0;
            padding: 0;
        }
        .nav{
            background-color:var(--color);
        }
        .container{
            background-color:var(--seccolor);

        }
        ul{
            display: flex;
        }
        ul li{
            opacity: 0.5;
            list-style: none;
            padding: 43px;
            border: 2px solid rgb(182, 84, 84);
        }
        ul li:first-child{
            --color:rgb(226, 192, 211);
            background-color: var(--color);

        }

    </style>
</head>
<body>
    
<div class="nav">
    <ul>
        <li>home</li>
        <li>about</li>
        <li>contact</li>
    </ul>
</div>
<div class="container">
    Lorem ipsum dolor sit amet consectetur adipisicing elit. Recusandae, dolor provident dolorem magni corporis porro. In excepturi laborum explicabo nostrum quos ab quod.
</div>
</body>
</html>
