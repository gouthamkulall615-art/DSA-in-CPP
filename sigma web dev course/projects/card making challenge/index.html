<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Card</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 260px;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.863);
    }

    .card img {
     
      width: 100%;
      height: 150px;
         padding: 6px;
         border-radius: 12px;
      /* object-fit: cover; */
    }

    .content {
      padding: 12px;
    }

    /* PILL STYLE */
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      font-size: 12px;
      border-radius: 999px;
        border: 1px solid red;
      background: #eee;
      margin-right: 6px;
    }

    h3 {
      margin: 8px 0 4px;
    }

    p {
      font-size: 14px;
      color: #555;
      /* margin: 0 0 10px; */
    }

    .btn {
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      background: #e7f1ff;
      
      color: blue;
      font-size: 13px;
      cursor: default;
    }
  </style>
</head>

<body>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470" alt="Nature">

    <div class="content">
      <span class="tag">Nature</span>
      <span class="tag">Lake</span>

      <h3>Lago di Braies</h3>
      <p>Beautiful lake in Italy.</p>

      <button class="btn">Read More</button>
    </div>
  </div>

</body>
</html>
