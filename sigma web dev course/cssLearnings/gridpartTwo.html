<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cssgridparttwo</title>
    <style>
        .container {
            border: 2px solid black;
            display: grid;
            /* grid-template-columns: [pehla] 120px [doosra] 100px [t];
            grid-template-rows: 100px 100px 100px; */
            grid-template-areas: "nav nav nav"
                                  "side article article"
                                  "footer footer footer";
        }

        .items {
            border: 2px solid purple;
            /* height: 55px;
            width: 55px; */
        }

        .item-1 {
            grid-area: nav;
        }

        .item-2 {
            grid-area: side;
        }

        .item-3 {
            grid-area: article;
        }

        .item-4 {
            grid-area: footer;
        }
        .item-5{
            grid-area: nav;
        }

       
    </style>

</head>

<body>
    <div class="container">
        <div class="items item-1">1</div>
        <div class="items item-2">2</div>
        <div class="items item-3">3</div>
        <div class="items item-4">4</div>
        <div class="items item-5">5</div>
    </div>
</body>

</html>
