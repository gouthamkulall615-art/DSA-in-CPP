<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slide nav bar</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/99aec78a90.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="main_box">
        <input type="checkbox" id="check">
        <div class="btn_one">
            <label for="check">
                <i class="fa-solid  fa-bars"></i>
            </label>
        </div>

        <div class="slidebar_menu">
            <div class="logo">
                <a href="#">CodingLab</a>
            </div>
            <div class="btn_two">
                <label for="check">
                    <i class="fas fa-times"></i>
                </label>
            </div>

            <ul class="menu">
                <li><a href="#"><i class="fa-solid fa-qrcode"></i> Dashboard</a></li>
                <li><a href="#"><i class="fa-solid fa-link"></i> Shortcuts</a></li>
                <li><a href="#"><i class="fa-solid fa-stream"></i> Overview</a></li>
                <li><a href="#"><i class="fa-solid fa-calendar-week"></i> Events</a></li>
                <li><a href="#"><i class="fa-solid fa-circle-question"></i> About</a></li>
                <li><a href="#"><i class="fa-solid fa-sliders"></i> Services</a></li>
                <li><a href="#"><i class="fa-solid fa-phone-volume"></i> Contact</a></li>
                <li><a href="#"><i class="fa-solid fa-comments"></i> Feedback</a></li>
            </ul>

            <div class="social_media">
                <a href="#"><i class="fa-brands fa-facebook"></i></a>
                <a href="#"><i class="fa-brands fa-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-youtube"></i></a>
            </div>
        </div>
    </div>
</body>
</html>
