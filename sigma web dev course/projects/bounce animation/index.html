<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            height: 121px;
            width: 121px;
            background-color: red;
            border-radius: 70px;
            position: absolute;
            bottom: 0;
            left: 0;
            /* animation: projectile 4s linear infinite; */
            animation: gouthux 3s linear infinite,
                       gouthuy 1s ease-out infinite alternate  ;
        }

        .container {
            position: relative;
            height: 80vh;
            width: 80vw;
            background-color: blue;
        }

        @keyframes gouthux {
            from {
                left: 0;
            }

            to {
                left: 100%;
            }
        }

        @keyframes gouthuy {
            from {
                bottom: 0;

            }

            to {
                bottom: 100%;
            }
        }
