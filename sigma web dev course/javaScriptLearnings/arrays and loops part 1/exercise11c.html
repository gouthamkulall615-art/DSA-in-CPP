<body>
    <script>
        let arr = [1, 2, 3, 4, 5];
        let swap = 0;
        arraySwap(arr);

        function arraySwap(arr) {

            swap = arr[0];
            arr[0] = arr[arr.length - 1];
            arr[arr.length - 1] = swap;

            console.log(arr);

        }
    </script>
</body>
